<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test segmento</title>
</head>

<body>

  <h1 id="resultado">CARGANDO...</h1>

  <p id="debug">Leyendo segmento...</p>

  <script>
    const parametros = new URLSearchParams(window.location.search);
    const segmento = parametros.get("segmento");

    const resultado = document.getElementById("resultado");
    const debug = document.getElementById("debug");

    debug.textContent = "Valor recibido: " + segmento;

    if (segmento === "CuratedFashionista") {
      resultado.textContent = "CURATED FASHIONISTA";
    } else if (segmento === "StylishFollower") {
      resultado.textContent = "STYLISH FOLLOWER";
    } else if (segmento === "LuxuryRefined") {
      resultado.textContent = "LUXURY REFINED";
    } else {
      resultado.textContent = "SEGMENTO NO RECONOCIDO";
    }
  </script>

</body>
</html>
