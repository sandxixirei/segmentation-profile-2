<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Test Supabase</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 800px;
      margin: 60px auto;
      padding: 20px;
      color: #111111;
    }

    #resultado {
      font-size: 48px;
      margin-bottom: 20px;
    }

    #detalle {
      font-size: 20px;
    }

    #diagnostico {
      margin-top: 35px;
      padding: 20px;
      background: #eeeeee;
      border: 1px solid #dddddd;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <h1 id="resultado">TEST SUPABASE</h1>

  <p id="detalle">
    Preparando consulta...
  </p>

  <div id="diagnostico">
    JavaScript todavía no iniciado.
  </div>

  <script>

    const SUPABASE_URL =
      "https://yxbxdslbqzagxdtvxcfn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ot_qmXz2rmPkZik1lotE4A_STBWA9p9";

    const parametros =
      new URLSearchParams(window.location.search);

    const responseId =
      parametros.get("responseid");

    const resultado =
      document.getElementById("resultado");

    const detalle =
      document.getElementById("detalle");

    const diagnostico =
      document.getElementById("diagnostico");

    diagnostico.textContent =
      "PASO 1 OK - JavaScript funciona";

    async function consultarSupabase() {

      diagnostico.textContent +=
        "\nPASO 2 - ResponseID: " + responseId;

      if (!responseId) {

        resultado.textContent =
          "FALTA RESPONSE ID";

        detalle.textContent =
          "La URL no contiene responseid.";

        return;
      }

      const url =
        SUPABASE_URL +
        "/rest/v1/segment_results_v2" +
        "?qualtrics_key=eq." +
        encodeURIComponent(responseId) +
        "&select=qualtrics_key,segmento,linea,status";

      diagnostico.textContent +=
        "\nPASO 3 - Consultando Supabase";

      diagnostico.textContent +=
        "\nURL API: " + url;

      try {

        const respuesta =
          await fetch(url, {
            method: "GET",
            headers: {
              "apikey": SUPABASE_KEY,
              "Accept": "application/json"
            }
          });

        diagnostico.textContent +=
          "\nPASO 4 - HTTP: " +
          respuesta.status;

        const cuerpo =
          await respuesta.text();

        diagnostico.textContent +=
          "\nPASO 5 - Supabase responde: " +
          cuerpo;

        if (!respuesta.ok) {

          resultado.textContent =
            "ERROR SUPABASE";

          detalle.textContent =
            "La consulta ha sido rechazada.";

          return;
        }

        const datos =
          JSON.parse(cuerpo);

        if (!Array.isArray(datos)) {

          resultado.textContent =
            "RESPUESTA NO VÁLIDA";

          detalle.textContent =
            "Supabase no ha devuelto una lista.";

          return;
        }

        if (datos.length === 0) {

          resultado.textContent =
            "SIN RESULTADO";

          detalle.textContent =
            "No existe un resultado READY para " +
            responseId +
            ".";

          return;
        }

        const perfil =
          datos[0];

        resultado.textContent =
          String(perfil.segmento).toUpperCase();

        detalle.textContent =
          "Línea: " +
          perfil.linea;

        diagnostico.textContent +=
          "\nPASO 6 OK - Perfil encontrado";

      }

      catch (error) {

        resultado.textContent =
          "ERROR DE CONEXIÓN";

        detalle.textContent =
          error.message;

        diagnostico.textContent +=
          "\nERROR: " +
          error.message;
      }
    }

    consultarSupabase();

  </script>

</body>

</html>
