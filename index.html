<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>Segmentación</title>
</head>


<body>

  <h1 id="resultado">
    SIN SEGMENTO
  </h1>


  <p id="debug">
    Esperando parámetro...
  </p>


  <script>

    const parametros =
      new URLSearchParams(window.location.search);

    const segmento =
      parametros.get("segmento");

    document.getElementById("debug").innerText =
      "Segmento recibido: " + segmento;


    if (segmento === "CuratedFashionista") {

      document.getElementById("resultado").innerText =
        "CURATED FASHIONISTA";

    }


    else if (segmento === "StylishFollower") {

      document.getElementById("resultado").innerText =
        "STYLISH FOLLOWER";

    }


    else if (segmento === "LuxuryRefined") {

      document.getElementById("resultado").innerText =
        "LUXURY REFINED";

    }


    else {

      document.getElementById("resultado").innerText =
        "SEGMENTO NO RECONOCIDO";

    }

  </script>

</body>

</html>
