  <title>Tu universo</title>

  <style>
    :root {
      --paper: #f3eee5;
      --paper-dark: #e8e0d4;
      --ink: #111111;
      --muted: #625c54;
      --line: rgba(17, 17, 17, 0.25);
      --white: #ffffff;

      --serif:
        "Didot",
        "Bodoni 72",
        Georgia,
        "Times New Roman",
        serif;

      --sans:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100%;
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    button {
      font: inherit;
    }

    [hidden] {
      display: none !important;
    }

    .pantalla {
      min-height: 100vh;
    }

    .marca {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 20;
      margin: 0;
      font-size: 10px;
      line-height: 1;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    /*
      PANTALLA DE CARGA
    */

    .pantalla-carga {
      display: grid;
      place-items: center;
      padding: 70px 24px 40px;
      text-align: center;
    }

    .carga-contenido {
      width: min(620px, 100%);
    }

    .carga-etiqueta {
      margin: 0 0 18px;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .carga-titulo {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(42px, 8vw, 82px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    .carga-texto {
      margin: 28px auto 0;
      color: var(--muted);
      font-size: 16px;
    }

    .progreso {
      position: relative;
      width: 180px;
      height: 2px;
      margin: 30px auto 0;
      overflow: hidden;
      background: rgba(17, 17, 17, 0.14);
    }

    .progreso::after {
      position: absolute;
      inset: 0;
      width: 42%;
      background: var(--ink);
      content: "";
      animation: progreso 1.5s ease-in-out infinite;
    }

    @keyframes progreso {
      from {
        transform: translateX(-110%);
      }

      to {
        transform: translateX(250%);
      }
    }

    /*
      PANTALLA DE RESULTADO
    */

    .pantalla-resultado {
      width: 100%;
      overflow: hidden;
      background: var(--paper);
    }

    .resultado-cabecera {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: 100px 28px 12px;
      text-align: center;
    }

    .resultado-etiqueta {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.23em;
      text-transform: uppercase;
    }

    .resultado-nombre {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(50px, 9vw, 118px);
      font-weight: 400;
      line-height: 0.88;
      letter-spacing: -0.055em;
      overflow-wrap: anywhere;
    }

    .resultado-titular {
      max-width: 650px;
      margin: 28px auto 0;
      font-family: var(--serif);
      font-size: clamp(20px, 2.6vw, 29px);
      font-weight: 400;
      line-height: 1.25;
    }

    /*
      UNIVERSO VISUAL
    */

    .universo {
      position: relative;
      width: min(1320px, 100%);
      height: min(71vw, 790px);
      min-height: 630px;
      margin: 10px auto 45px;
    }

    .universo-centro {
      position: absolute;
      top: 50%;
      left: 50%;
      width: min(27vw, 350px);
      transform: translate(-50%, -47%);
      text-align: center;
    }

    .figura-central {
      position: relative;
      width: 100%;
      aspect-ratio: 0.72;
      overflow: hidden;
      border-radius: 46% 46% 12% 12%;
      background:
        radial-gradient(
          circle at 50% 18%,
          #c8b9a6 0 11%,
          transparent 11.5%
        ),
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.8),
          rgba(196, 180, 159, 0.84)
        );
      box-shadow:
        0 30px 45px -34px rgba(0, 0, 0, 0.42);
    }

    .figura-central::before {
      position: absolute;
      top: 27%;
      right: 21%;
      bottom: 8%;
      left: 21%;
      border-radius: 45% 45% 12% 12%;
      background:
        linear-gradient(
          165deg,
          #2b2927,
          #53504b
        );
      content: "";
    }

    .figura-central::after {
      position: absolute;
      right: 17%;
      bottom: 0;
      left: 17%;
      height: 28%;
      border-radius: 50%;
      background:
        radial-gradient(
          ellipse at center,
          rgba(17, 17, 17, 0.2),
          transparent 68%
        );
      content: "";
    }

    .etiqueta-central {
      display: inline-block;
      margin-top: 12px;
      padding: 5px 11px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      font-size: 10px;
      letter-spacing: 0.04em;
    }

    .objeto {
      position: absolute;
      display: grid;
      place-items: center;
      width: clamp(94px, 11vw, 160px);
      aspect-ratio: 1;
      transform: rotate(var(--rotacion, 0deg));
      transition:
        transform 260ms ease,
        filter 260ms ease;
    }

    .objeto:hover {
      transform:
        translateY(-7px)
        rotate(var(--rotacion, 0deg));
      filter:
        drop-shadow(
          0 15px 10px rgba(0, 0, 0, 0.12)
        );
    }

    .objeto-cuerpo {
      display: grid;
      place-items: center;
      width: 78%;
      aspect-ratio: 1;
      border: 1px solid rgba(17, 17, 17, 0.12);
      border-radius: 42% 58% 48% 52%;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.88),
          rgba(221, 211, 197, 0.68)
        );
      box-shadow:
        0 20px 28px -24px rgba(0, 0, 0, 0.5);
      font-size: clamp(35px, 5vw, 65px);
    }

    .objeto-texto {
      display: inline-block;
      margin-top: -3px;
      padding: 4px 8px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--paper);
      font-size: 9px;
      line-height: 1.2;
      white-space: nowrap;
    }

    .objeto-1 {
      top: 13%;
      left: 6%;
      --rotacion: -7deg;
    }

    .objeto-2 {
      top: 0;
      left: 25%;
      --rotacion: 5deg;
    }

    .objeto-3 {
      top: 15%;
      right: 7%;
      --rotacion: 7deg;
    }

    .objeto-4 {
      bottom: 8%;
      left: 8%;
      --rotacion: 6deg;
    }

    .objeto-5 {
      right: 25%;
      bottom: 1%;
      --rotacion: -5deg;
    }

    .objeto-6 {
      right: 4%;
      bottom: 23%;
      --rotacion: 8deg;
    }

    /*
      TEXTO EDITORIAL
    */

    .editorial {
      width: min(770px, 100%);
      margin: 0 auto;
      padding: 0 28px 100px;
      text-align: center;
    }

    .editorial-descripcion {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(22px, 2.6vw, 34px);
      line-height: 1.38;
      letter-spacing: -0.02em;
    }

    .palabras-titulo {
      margin: 52px 0 18px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.19em;
      text-transform: uppercase;
    }

    .palabras {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px;
    }

    .palabra {
      display: inline-flex;
      min-height: 34px;
      align-items: center;
      padding: 7px 13px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      font-size: 12px;
    }

    /*
      PANTALLA DE MENSAJE
    */

    .pantalla-mensaje {
      display: grid;
      place-items: center;
      padding: 70px 24px 40px;
      text-align: center;
    }

    .mensaje {
      width: min(560px, 100%);
    }

    .mensaje-etiqueta {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .mensaje-titulo {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(42px, 8vw, 75px);
      font-weight: 400;
      line-height: 0.95;
      letter-spacing: -0.045em;
    }

    .mensaje-texto {
      margin: 26px auto 0;
      color: var(--muted);
      font-size: 17px;
    }

    .boton {
      margin-top: 28px;
      padding: 13px 22px;
      border: 1px solid var(--ink);
      border-radius: 999px;
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      font-size: 11px;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .boton:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    /*
      RESPONSIVE

    @media (max-width: 760px) {
      .marca {
        top: 18px;
        left: 18px;
      }

      .resultado-cabecera {

      .resultado-titular {

      .editorial {
        padding: 0 20px 70px;
      }

      .editorial-descripcion {
        font-size: 23px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progreso::after {
        animation: none;
      }

      .objeto {
        transition: none;
      }

      .objeto:hover {
        transform: rotate(var(--rotacion, 0deg));
        filter: none;
      }
    }
  </style>

    function limpiarIdentificador(valor) {
      const limpio =
        String(valor || "").trim();

      if (!limpio) {
        return null;
      }

      if (limpio.length > 120) {
        return null;
      }

      if (!/^[A-Za-z0-9_-]+$/.test(limpio)) {
        return null;
      }

      return limpio;
    }


    function normalizarTexto(valor) {
      return String(valor || "")
        .trim()
        .replace(/\s+/g, " ")
        .toUpperCase();
    }


    function mostrarPantalla(nombre) {
      pantallaCarga.hidden =
        nombre !== "carga";

      pantallaResultado.hidden =
        nombre !== "resultado";

      pantallaMensaje.hidden =
        nombre !== "mensaje";
    }


    function finalizarConsultas() {
      consultaTerminada = true;

      if (temporizadorPendiente) {
        clearTimeout(temporizadorPendiente);
        temporizadorPendiente = null;
      }
    }


    /*
      ========================================================
      CONSULTA DEL RESULTADO
      ========================================================
    */

    async function consultarPerfil() {
      if (consultaTerminada) {
        return;
      }

      intentoActual++;


      if (!responseId) {
        finalizarConsultas();

        mostrarMensaje(
          "No encontramos tu resultado",
          "Parece que el enlace no está completo. Vuelve a abrirlo desde el final del cuestionario.",
          false
        );

        return;
      }


      if (
        !SUPABASE_KEY ||
        SUPABASE_KEY ===
          "PEGA_AQUI_TU_CLAVE_PUBLICA_DE_SUPABASE"
      ) {
        finalizarConsultas();

        mostrarMensaje(
          "Página en preparación",
          "La configuración de esta página todavía no está completa.",
          false
        );

        return;
      }


      const url =
        SUPABASE_URL +
        "/rest/v1/segment_results_v2" +
        "?qualtrics_key=eq." +
        encodeURIComponent(responseId) +
        "&select=segmento,linea,status" +
        "&limit=1";


      try {
        const respuesta =
          await fetch(
            url,
            {
              method: "GET",
              cache: "no-store",

              headers: {
                "apikey": SUPABASE_KEY,
                "Accept": "application/json"
              }
            }
          );


        if (!respuesta.ok) {
          throw new Error(
            "Error HTTP " +
            respuesta.status
          );
        }


        const datos =
          await respuesta.json();


        if (
          Array.isArray(datos) &&
          datos.length > 0
        ) {
          const perfil = datos[0];

          const estado =
            normalizarTexto(perfil.status);


          if (estado === "READY") {
            finalizarConsultas();

            mostrarPerfil(perfil);

            return;
          }


          if (
            estado === "ERROR" ||
            estado === "DATOS INCOMPLETOS" ||
            estado === "REVISAR EMPATE"
          ) {
            finalizarConsultas();

            mostrarMensaje(
              "No hemos podido preparar tu universo",
              "No hemos podido mostrar el resultado. Vuelve a intentarlo desde el enlace original.",
              false
            );

            return;
          }
        }


        reintentar();

      } catch (error) {
        console.warn(
          "[landing] No se ha podido consultar el resultado."
        );

        reintentar();
      }
    }


    function reintentar() {
      if (consultaTerminada) {
        return;
      }


      if (intentoActual < MAX_INTENTOS) {
        textoCarga.textContent =
          intentoActual < 6
            ? "Estamos reuniendo las pequeñas cosas que definen tu mundo."
            : "Estamos ajustando los últimos detalles de tu universo.";

        temporizadorPendiente =
          setTimeout(
            consultarPerfil,
            INTERVALO
          );

        return;
      }


      finalizarConsultas();

      mostrarMensaje(
        "Tu universo está casi listo",
        "El resultado está tardando un poco más de lo esperado. Puedes volver a intentarlo.",
        true
      );
    }


    /*
      ========================================================
      RESULTADO PUBLICO
      ========================================================
    */

    function mostrarPerfil(perfil) {
      const segmentoInterno =
        normalizarTexto(perfil.segmento);

      const universo =
        UNIVERSOS[segmentoInterno];


      if (!universo) {
        mostrarMensaje(
          "Tu universo necesita un último detalle",
          "El resultado existe, pero todavía no tiene una experiencia pública disponible.",
          false
        );

        return;
      }


      resultadoEtiqueta.textContent =
        "Tu universo";

      resultadoNombre.textContent =
        universo.nombre;

      resultadoTitular.textContent =
        universo.titular;

      resultadoDescripcion.textContent =
        universo.descripcion;

      etiquetaCentral.textContent =
        universo.nombre;


      resultadoPalabras.replaceChildren();

      universo.palabras.forEach(
        function(palabra) {
          const elemento =
            document.createElement("span");

          elemento.className =
            "palabra";

          elemento.textContent =
            palabra;

          resultadoPalabras.appendChild(
            elemento
          );
        }
      );


      universo.objetos.forEach(
        function(objeto, indice) {
          const numero =
            indice + 1;

          const icono =
            document.getElementById(
              "objetoIcono" + numero
            );

          const texto =
            document.getElementById(
              "objetoTexto" + numero
            );

          const contenedor =
            icono.closest(".objeto");

          icono.textContent =
            objeto.icono;

          texto.textContent =
            objeto.texto;

          contenedor.setAttribute(
            "aria-label",
            objeto.texto
          );
        }
      );


      document.title =
        universo.nombre +
        " | Tu universo";

      mostrarPantalla("resultado");

      window.scrollTo({
        top: 0,
        behavior: "auto"
      });
    }


    /*
      ========================================================
      MENSAJES CONTROLADOS
      ========================================================
    */

    function mostrarMensaje(
      titulo,
      texto,
      permitirReintento
    ) {
      resultadoNombre.textContent = "";
      resultadoTitular.textContent = "";
      resultadoDescripcion.textContent = "";
      resultadoPalabras.replaceChildren();

      mensajeTitulo.textContent =
        titulo;

      mensajeTexto.textContent =
        texto;

      botonReintentar.hidden =
        !permitirReintento;

      botonReintentar.onclick =
        function() {
          window.location.reload();
        };

      mostrarPantalla("mensaje");

      if (permitirReintento) {
        botonReintentar.focus();
      }
    }


    /*
      ========================================================
      ARRANQUE
      ========================================================
    */

    mostrarPantalla("carga");

    consultarPerfil();
  </script>

</body>

</html>
