<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tu perfil</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #ffffff;
      color: #111111;
    }

    .contenedor {
      min-height: 100vh;
      max-width: 850px;
      margin: 0 auto;
      padding: 80px 30px;
      box-sizing: border-box;
    }

    .etiqueta {
      font-size: 13px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    #resultado {
      font-size: 52px;
      line-height: 1.05;
      margin: 0 0 25px 0;
      font-weight: 600;
    }

    #detalle {
      font-size: 20px;
      line-height: 1.5;
    }

    #cargando {
      margin-top: 40px;
      font-size: 14px;
      color: #777777;
    }

    .puntos {
      display: inline-block;
      width: 30px;
    }

    @media (max-width: 650px) {
      .contenedor {
        padding: 55px 25px;
      }

      #resultado {
        font-size: 40px;
      }

      #detalle {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="contenedor">

    <div class="etiqueta">
      Tu perfil
    </div>

    <h1 id="resultado">
      ESTAMOS PREPARANDO TU PERFIL
    </h1>

    <p id="detalle">
      Estamos calculando tu resultado.
    </p>

    <div id="cargando">
      Por favor, no cierres esta página<span class="puntos">...</span>
    </div>

  </main>


  <script>

    const SUPABASE_URL =
      "https://yxbxdslbqzagxdtvxcfn.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_Ot_qmXz2rmPkZik1lotE4A_STBWA9p9";


    const parametros =
      new URLSearchParams(window.location.search);

    const responseId =
      parametros.get("responseid");


    const resultado =
      document.getElementById("resultado");

    const detalle =
      document.getElementById("detalle");

    const cargando =
      document.getElementById("cargando");


    const MAX_INTENTOS = 15;

    const INTERVALO = 2000;

    let intentoActual = 0;


    async function consultarPerfil() {

      intentoActual++;


      if (!responseId) {

        resultado.textContent =
          "NO SE HA PODIDO CARGAR EL PERFIL";

        detalle.textContent =
          "No hemos recibido el identificador de la respuesta.";

        cargando.style.display =
          "none";

        return;
      }


      const url =
        SUPABASE_URL +
        "/rest/v1/segment_results_v2" +
        "?qualtrics_key=eq." +
        encodeURIComponent(responseId) +
        "&select=qualtrics_key,segmento,linea,status";


      try {

        const respuesta =
          await fetch(
            url,
            {
              method: "GET",

              headers: {
                "apikey": SUPABASE_KEY,
                "Accept": "application/json"
              }
            }
          );


        if (!respuesta.ok) {
          throw new Error(
            "Error HTTP " +
            respuesta.status
          );
        }


        const datos =
          await respuesta.json();


        if (
          datos.length > 0 &&
          datos[0].status === "READY"
        ) {

          mostrarPerfil(datos[0]);

          return;
        }


        reintentar();

      }

      catch (error) {

        console.error(error);

        reintentar();

      }

    }


    function reintentar() {

      if (intentoActual < MAX_INTENTOS) {

        setTimeout(
          consultarPerfil,
          INTERVALO
        );

        return;
      }


      resultado.textContent =
        "TU PERFIL ESTÁ CASI LISTO";

      detalle.textContent =
        "No hemos podido cargar el resultado automáticamente.";

      cargando.textContent =
        "Puedes actualizar esta página para consultar tu perfil.";

    }


    function mostrarPerfil(perfil) {

      cargando.style.display =
        "none";


      resultado.textContent =
        String(perfil.segmento).toUpperCase();


      detalle.textContent =
        "Línea: " +
        perfil.linea;

    }


    consultarPerfil();

  </script>

</body>

</html>
